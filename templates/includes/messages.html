{% if messages %}
  <div class="messages" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div
        class="alert alert--{{ message.tags|default:'info' }}"
        data-dismissible
        role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}"
      >
        <span class="alert__text">{{ message }}</span>
        <button type="button" class="alert__close" data-dismiss aria-label="Cerrar mensaje">
          &times;
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
